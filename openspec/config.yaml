strict_tdd: true
context: |
  frontend is a Node.js/TypeScript ESM, React, Python project.
  Detected markers: frontend/package.json, frontend/tsconfig.json, frontend/npm package manager.
  Package managers: npm.
  Additional evidence: Test-like files detected (11); examples: backend\.venv\Lib\site-packages\colorama\tests\ansi_test.py, backend\.venv\Lib\site-packages\colorama\tests\ansitowin32_test.py, backend\.venv\Lib\site-packages\colorama\tests\initialise_test.py, backend\.venv\Lib\site-packages\colorama\tests\isatty_test.py, backend\.venv\Lib\site-packages\colorama\tests\winterm_test.py.
  Primary test command: cd frontend && npm test.
  Unit tests: Vitest (cd frontend && npm test); pytest (pytest).
  Integration tests: Testing Library (cd frontend && npm test).
  E2E tests: none.
rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    test_command: "cd frontend && npm test"
  verify:
    test_command: "cd frontend && npm test"
testing:
  detected: "2026-07-05"
  runner:
    command: "cd frontend && npm test"
    framework: "Vitest"
  layers:
    unit: "Vitest, pytest"
    integration: "Testing Library"
    e2e: ""
  commands:
    unit:
      - scope: "frontend"
        command: "cd frontend && npm test"
        framework: "Vitest"
      - scope: "."
        command: "pytest"
        framework: "pytest"
    integration:
      - scope: "frontend"
        command: "cd frontend && npm test"
        framework: "Testing Library"
    e2e:
      []
  coverage:
    command: ""
    commands:
      []
quality:
  lint: "cd frontend && npm run lint"
  lint_commands:
    - scope: "frontend"
      command: "cd frontend && npm run lint"
      framework: "linter"
  typecheck: ""
  typecheck_commands:
    []
  format: ""
  format_commands:
    []
