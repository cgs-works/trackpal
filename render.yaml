services:
  - type: web
    name: trackpal-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install uv && uv sync --directory backend
    startCommand: uv run --directory backend alembic upgrade head && uv run --directory backend python scripts/seed.py && uv run --directory backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: N8N_API_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: MASTER_USERNAME
        value: "master"
      - key: MASTER_PASSWORD
        sync: false
      - key: MASTER_NAME
        value: "Master Trackpal"
      - key: MASTER_PHONE
        sync: false
      - key: EVOLUTION_API_URL
        value: "https://rs-evoapi.wilfredocamacho.dev"
      - key: EVOLUTION_API_KEY
        sync: false
