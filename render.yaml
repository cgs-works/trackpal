services:
  - type: web
    name: trackpal-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync
    startCommand: uv run alembic upgrade head && uv run python -m scripts.seed && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: N8N_API_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: MASTER_USERNAME
        value: "master"
      - key: MASTER_PASSWORD
        sync: false
      - key: MASTER_NAME
        value: "Master TrackPal"
      - key: MASTER_PHONE
        sync: false
      - key: EVOLUTION_API_URL
        value: "https://rs-evoapi.wilfredocamacho.dev"
      - key: EVOLUTION_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://trackpal.pages.dev"
      # Redis HA configuration (set these in Render dashboard)
      - key: REDIS_PRIMARY_URL
        sync: false
      - key: REDIS_BACKUP_URL
        sync: false
      - key: REDIS_POOL_SIZE
        value: "20"
      - key: REDIS_SOCKET_TIMEOUT_SECONDS
        value: "5.0"
      - key: REDIS_CONNECT_TIMEOUT_SECONDS
        value: "5.0"
      - key: REDIS_HEALTH_CHECK_INTERVAL_SECONDS
        value: "30.0"
      - key: REDIS_FAILOVER_FAILURE_THRESHOLD
        value: "3"
      - key: REDIS_BREAKER_OPEN_SECONDS
        value: "30"
      - key: WHATSAPP_SESSION_TTL_MINUTES
        value: "15"
