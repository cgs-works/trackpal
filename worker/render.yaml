services:
  - type: web
    name: trackpal-lookup-executor
    runtime: python
    region: oregon
    plan: free
    rootDir: worker
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TRACKPAL_EXECUTOR_ID
        sync: false
      - key: TRACKPAL_EXECUTOR_SECRET
        sync: false
      - key: TRACKPAL_MAX_CONCURRENCY
        value: "1"
